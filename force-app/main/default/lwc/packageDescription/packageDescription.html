<template>
    <template if:true={packageData}>

        <div class="backdrop" onclick={closeModal}></div>

        <section class="modal">
            <div class="modal-content">

                <button class="close-btn" onclick={closeModal}>×</button>

                <!-- STEP 1: PACKAGE DETAILS + BOOK NOW -->
                <!-- This entire section disappears after clicking Next. -->
                <template if:true={showPackageDetails}>
                    <h2 class="package-name">{packageData.Package_Name__c}</h2>

                    <div class="modal-body">
                        <div class="details-section">
                            <lightning-formatted-rich-text value={packageData.Description__c}>
                            </lightning-formatted-rich-text>

                            <div>
                                <p class="price">
                                    <strong>Price:</strong> ₹{packageData.Price__c}
                                </p>
                            </div>
                        </div>

                        <div class="image-section">
                            <lightning-formatted-rich-text value={packageData.Image_URL__c}>
                            </lightning-formatted-rich-text>
                        </div>
                    </div>

                    <!-- BOOK NOW IS SHOWN ONLY BEFORE DATE CONFIRMATION. -->
                    <template if:true={showBookNow}>
                        <template lwc:if={pageName}>
                            <lightning-button
                                label="Confirm BookNow"
                                class="book-btn1"
                                data-id={packageData.Id}
                                onclick={handleBooking}>
                            </lightning-button>
                        </template>

                        <template lwc:else>
                            <button
                                class="book-btn"
                                data-id={packageData.Id}
                                onclick={handleBooking}>
                                Book Now
                            </button>
                        </template>
                    </template>
                </template>

                <!-- STEP 2: DATE SELECTION -->
                <template if:true={showBookingModal}>
                    <div class="modal-backdrop"></div>

                    <section class="slds-modal slds-fade-in-open">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">
                                Select Travel Dates
                            </h2>
                        </header>

                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="calendar">
                                <div class="calendar-header">
                                    <lightning-button-icon
                                        icon-name="utility:chevronleft"
                                        alternative-text="Previous Month"
                                        onclick={previousMonth}>
                                    </lightning-button-icon>

                                    <h2>{monthYear}</h2>

                                    <lightning-button-icon
                                        icon-name="utility:chevronright"
                                        alternative-text="Next Month"
                                        onclick={nextMonth}>
                                    </lightning-button-icon>
                                </div>

                                <div class="weekdays">
                                    <span>Sun</span>
                                    <span>Mon</span>
                                    <span>Tue</span>
                                    <span>Wed</span>
                                    <span>Thu</span>
                                    <span>Fri</span>
                                    <span>Sat</span>
                                </div>

                                <div class="days">
                                    <template for:each={calendarDays} for:item="day">
                                        <div
                                            key={day.key}
                                            class={day.className}
                                            data-date={day.fullDate}
                                            onclick={handleDateSelect}>
                                            {day.day}
                                        </div>
                                    </template>
                                </div>

                                <template if:true={startDate}>
                                    <p class="slds-m-top_medium">
                                        Check-In: {startDate}
                                    </p>
                                </template>

                                <template if:true={endDate}>
                                    <p>
                                        Check-Out: {endDate}
                                    </p>
                                </template>
                            </div>
                        </div>

                        <footer class="slds-modal__footer custom-footer">
                            <div class="left-sections">
                                <lightning-button
                                    label="Cancel"
                                    onclick={closeModalDate}>
                                </lightning-button>

                                <lightning-button
                                    label="Next"
                                    variant="brand"
                                    onclick={confirmBooking}>
                                </lightning-button>
                            </div>
                        </footer>
                    </section>
                </template>

                <!-- STEP 3: ONLY TRAVELER DETAILS -->
                <!-- After Next, package image, description, price and Book Now are all hidden. -->
                <template if:true={showTravellers}>
                    <c-travellers
                        package-id={packageData.Id}
                        start-date={startDate}
                        end-date={endDate}>
                    </c-travellers>
                </template>

            </div>
        </section>

    </template>
</template>
